  title: The caller does not have permission to perform this action.
  remediation: Verify the IAM policy grants the required appflow permissions.
- status: 404
  name: ResourceNotFoundException
  title: The requested flow, connector, or connector profile was not found.
  remediation: Confirm the resource name/ARN and region.
- status: 409
  name: ConflictException
  title: The request conflicts with the current state of the resource.
  remediation: The resource may already exist or be in use by a running flow; resolve the conflict and retry.
- status: 500
